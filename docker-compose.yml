services:
  db:
    image: postgres:16-alpine
    container_name: we_invited_pg
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: weinvited_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d weinvited_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: we_invited_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://admin:adminpassword@db:5432/weinvited_db?schema=public"
      JWT_SECRET: "super_secret_world_class_key_change_me_in_prod"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "bunx prisma db push && bun run src/index.ts"

volumes:
  db_data:
